<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Save Christmas from Crampus</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #18203a;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>


		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"../_engine/4.6.3.stable-d58e7ddb97/index","experimentalVK":false,"fileSizes":{"index.pck":3815652,"../_engine/4.6.3.stable-d58e7ddb97/index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"mainPack":"index.pck"};
const GODOT_THREADS_ENABLED = false;
// Crampus's one change to Godot's page (the rest is the Web export template's own shell): the
// engine's script is fetched and run with emscripten's WebGL name allocator replaced. As
// exported, GL.getNewId never hands a freed name out again and fills every GL table (buffers,
// VAOs, syncs, ...) up to the highest name ever made, while Godot's 2D renderer makes and frees
// a buffer pair and a VAO for each polygon of every redrawn canvas item, hundreds a frame: a tab's
// JS heap grew without end until the browser killed the page (docs/perf-long-run.md). The
// replacement hands out freed names again: when its list of free names runs out it scans the
// table for them, and after a scan that found none it waits half the table's size in new names
// before the next, so a name costs O(1) on average. tools/qa/smoke.py fails on a template whose
// allocator is not GL_IDS_FROM (the page shows why and stops).
const GL_IDS_FROM = 'getNewId:table=>{var ret=GL.counter++;for(var i=table.length;i<ret;i++){table[i]=null}return ret}';
const GL_IDS_TO = 'getNewId:table=>{var free=table.freeIds||(table.freeIds=[]);if(!free.length&&!(table.scanWait>0)){for(var i=table.length-1;i>0;i--){if(table[i]===null)free.push(i)}table.scanWait=free.length?0:table.length>>1}while(free.length){var id=free.pop();if(table[id]===null)return id}table.scanWait--;return table.length||1}';
let engine = null;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// The engine's script, run as an inline script so its top-level Engine is a page global. Its
	// path is the config's executable, which the playtests site's deploy points at its shared
	// engine folder (tools/ci/deploy_playtest.sh).
	function loadEngine() {
		return fetch(GODOT_CONFIG['executable'] + '.js').then((response) => {
			if (!response.ok) {
				throw new Error('Loading the game failed (' + response.status + '). Reload the page.');
			}
			return response.text();
		}).then((source) => {
			const patched = source.replace(GL_IDS_FROM, () => GL_IDS_TO);
			if (patched === source) {
				throw new Error('This build\'s engine script is not the one its page was made for (WebGL names). Export it again with the Godot version in game.cfg.');
			}
			const script = document.createElement('script');
			script.textContent = patched;
			document.body.appendChild(script);
		});
	}

	function start() {
		engine = new Engine(GODOT_CONFIG);
		const missing = Engine.getMissingFeatures({
			threads: GODOT_THREADS_ENABLED,
		});

		if (missing.length !== 0) {
			if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
				let serviceWorkerRegistrationPromise;
				try {
					serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
				} catch (err) {
					serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
				}
				// There's a chance that installing the service worker would fix the issue
				Promise.race([
					serviceWorkerRegistrationPromise.then((registration) => {
						if (registration != null) {
							return Promise.reject(new Error('Service worker already exists.'));
						}
						return registration;
					}).then(() => engine.installServiceWorker()),
					// For some reason, `getRegistration()` can stall
					new Promise((resolve) => {
						setTimeout(() => resolve(), 2000);
					}),
				]).then(() => {
					// Reload if there was no error.
					window.location.reload();
				}).catch((err) => {
					console.error('Error while registering service worker:', err);
				});
			} else {
				// Display the message as usual
				const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
				displayFailureNotice(missingMsg + missing.join('\n'));
			}
		} else {
			setStatusMode('progress');
			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			}).then(() => {
				setStatusMode('hidden');
			}, displayFailureNotice);
		}
	}

	setStatusMode('progress');
	loadEngine().then(start).catch(displayFailureNotice);
}());
		</script>
	</body>
</html>
